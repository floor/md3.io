# nginx vhost — md3.io (canonical) + www redirect, behind Cloudflare.
# Bun (pm2 "md3.io", port 4300) handles routing, caching and compression; nginx only proxies.
# TLS by certbot (Let's Encrypt, auto-renewed): sudo certbot --nginx -d md3.io -d www.md3.io

server {
    server_name md3.io;

    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    include /etc/nginx/cloudflare/real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   $http_accept_encoding;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Certbot ACME challenges
    location ~ /\.well-known {
        allow all;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/md3.io-access.log;
    error_log  /var/log/nginx/md3.io-error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/md3.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/md3.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.md3.io;
    return 301 https://md3.io$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/md3.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/md3.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = md3.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name md3.io;
    return 404; # managed by Certbot


}

server {
    if ($host = www.md3.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.md3.io;
    return 404; # managed by Certbot


}