# nginx vhost — mtrl.app, retired: every page redirects (301) to its md3.io counterpart.
# Installed as /etc/nginx/sites-available/mtrl.app, in place of the old mtrl-app proxy.
# A path with no counterpart goes to the md3.io page closest to it, else the homepage.

map $uri $md3io_path {
    default                                   /;
    # Crawlers read robots.txt first: send it to md3.io's, not to the homepage
    ~^/robots\.txt$                           /robots.txt;
    ~^/sitemap\.xml$                          /sitemap.xml;
    ~^/components/?$                          /components/;

    ~^/components/buttons/common/?$           /components/button/;
    ~^/components/buttons/icon-buttons/?$     /components/icon-button/;
    ~^/components/buttons/button-groups/?$    /components/button-group/;
    ~^/components/buttons/split-button/?$     /components/split-button/;
    ~^/components/buttons/fab/?$              /components/fab/;
    ~^/components/buttons/extended-fab/?$     /components/extended-fab/;
    ~^/components/buttons/segmented-buttons/?$ /docs/components/segmented-button/;
    ~^/components/buttons                     /components/button/;
    ~^/components/checkboxes/?$               /components/checkbox/;
    ~^/components/switches/?$                 /components/switch/;
    ~^/components/radios/?$                   /components/radios/;
    ~^/components/chips/?$                    /components/chips/;
    ~^/components/sliders/?$                  /components/slider/;
    ~^/components/textfields/?$               /components/textfield/;
    ~^/components/selects/?$                  /components/select/;
    ~^/components/search/?$                   /components/search/;
    ~^/components/datepickers/?$              /components/datepicker/;
    ~^/components/timepickers/?$              /components/timepicker/;
    ~^/components/navigation/rail/?$          /components/navigation-rail/;
    ~^/components/navigation/drawer/?$        /components/drawer/;
    ~^/components/tabs/?$                     /components/tabs/;
    ~^/components/menus/?$                    /components/menu/;
    ~^/components/app-bars/top/?$             /components/top-app-bar/;
    ~^/components/app-bars/bottom/?$          /components/bottom-app-bar/;
    ~^/components/cards/?$                    /components/card/;
    ~^/components/lists/?$                    /components/list/;
    ~^/components/carousel/?$                 /components/carousel/;
    ~^/components/dialogs/?$                  /components/dialog/;
    ~^/components/sheets/bottom/?$            /components/bottom-sheet/;
    ~^/components/sheets/side/?$              /components/side-sheet/;
    ~^/components/badges/?$                   /components/badge/;
    ~^/components/loading/progress/?$         /components/progress/;
    ~^/components/loading/loading-indicator/?$ /components/loading-indicator/;
    ~^/components/snackbars/?$                /components/snackbar/;
    ~^/components/tooltips?/?$                /components/tooltip/;
    ~^/components/dividers?/?$                /components/divider/;
    ~^/components/                            /components/;

    ~^/core                                   /docs/architecture/;
    ~^/styles/colou?rs?/?$                    /styles/color/;
    ~^/styles/typography/?$                   /styles/typography/;
    ~^/styles                                 /styles/;
}

server {
    listen 443 ssl http2;
    server_name mtrl.app www.mtrl.app;

    ssl_certificate /etc/letsencrypt/live/mtrl.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtrl.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # In a location, not at server level: certbot's nginx plugin renews by adding its
    # own challenge location, which a server-level return would preempt
    location / {
        return 301 https://md3.io$md3io_path;
    }
}

server {
    listen 80;
    server_name mtrl.app www.mtrl.app;

    location / {
        return 301 https://md3.io$md3io_path;
    }
}
